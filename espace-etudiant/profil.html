<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - Espace Étudiant | Rasin Ayiti</title>

    <link rel="icon" href="../assets/logorasin.PNG" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css?v=20260924">
</head>
<body>
    <div class="student-dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../assets/logorasin.PNG" alt="Rasin Ayiti" class="sidebar-logo">
                <span>Rasin Ayiti</span>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Tableau de bord</span>
                </a>
                <a href="mes-formations.html" class="nav-item">
                    <i class="fas fa-graduation-cap"></i>
                    <span>Mes Formations</span>
                </a>
                <a href="mes-seminaires.html" class="nav-item">
                    <i class="fas fa-video"></i>
                    <span>Mes Séminaires</span>
                </a>
                <a href="mes-evenements.html" class="nav-item">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Mes Événements</span>
                </a>
                <a href="certificats.html" class="nav-item">
                    <i class="fas fa-certificate"></i>
                    <span>Certificats</span>
                </a>
                <a href="profil.html" class="nav-item active">
                    <i class="fas fa-user"></i>
                    <span>Mon Profil</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="#" class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Déconnexion</span>
                </a>
            </div>
        </aside>

        <div class="sidebar-overlay" id="studentOverlay" onclick="toggleStudentSidebar()"></div>

        <main class="main-content">
            <header class="dashboard-header">
                <div class="header-left">
                    <button class="mobile-toggle" onclick="toggleStudentSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div>
                        <h1>Mon Profil</h1>
                        <p>Gérez vos informations personnelles</p>
                    </div>
                </div>
            </header>

            <div class="dashboard-grid">
                <div class="card">
                    <div class="card-header"><h2>Informations personnelles</h2></div>
                    <div class="card-body">
                        <form id="profileForm">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Prénom</label>
                                    <input type="text" id="prenom" class="form-input">
                                </div>
                                <div class="form-group">
                                    <label>Nom</label>
                                    <input type="text" id="nom" class="form-input">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="email" class="form-input" disabled>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Téléphone</label>
                                    <input type="tel" id="telephone" class="form-input">
                                </div>
                                <div class="form-group">
                                    <label>WhatsApp</label>
                                    <input type="tel" id="whatsapp" class="form-input">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Ville</label>
                                    <input type="text" id="ville" class="form-input">
                                </div>
                                <div class="form-group">
                                    <label>Profession</label>
                                    <input type="text" id="profession" class="form-input">
                                </div>
                            </div>
                            <button type="submit" class="btn-submit" id="saveBtn">
                                <i class="fas fa-save"></i> Enregistrer
                            </button>
                            <p id="profileMsg" style="margin-top:1rem; font-weight:600;"></p>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><h2>Changer le mot de passe</h2></div>
                    <div class="card-body">
                        <form id="passwordForm">
                            <div class="form-group">
                                <label>Nouveau mot de passe</label>
                                <input type="password" id="newPass" class="form-input" minlength="6" placeholder="Minimòm 6 karaktè">
                            </div>
                            <div class="form-group">
                                <label>Confirmer</label>
                                <input type="password" id="confirmPass" class="form-input" minlength="6">
                            </div>
                            <button type="submit" class="btn-submit">
                                <i class="fas fa-key"></i> Mettre à jour
                            </button>
                            <p id="passMsg" style="margin-top:1rem; font-weight:600;"></p>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <style>
        .student-dashboard { display:flex; min-height:100vh; background:#f8fafc; }
        .sidebar { width:260px; background:linear-gradient(180deg,#1e293b,#0f172a); padding:1.5rem; display:flex; flex-direction:column; position:fixed; height:100vh; left:0; top:0; }
        .sidebar-header { display:flex; align-items:center; gap:0.75rem; margin-bottom:2.5rem; padding-bottom:1.5rem; border-bottom:1px solid rgba(255,255,255,0.1); }
        .sidebar-logo { width:45px; height:45px; border-radius:10px; }
        .sidebar-header span { color:white; font-weight:700; font-size:1.1rem; }
        .sidebar-nav { flex:1; display:flex; flex-direction:column; gap:0.5rem; }
        .nav-item { display:flex; align-items:center; gap:1rem; padding:0.875rem 1rem; color:#94a3b8; text-decoration:none; border-radius:10px; transition:all 0.3s; }
        .nav-item:hover, .nav-item.active { background:rgba(255,255,255,0.1); color:white; }
        .nav-item i { width:20px; text-align:center; }
        .sidebar-footer { padding-top:1.5rem; border-top:1px solid rgba(255,255,255,0.1); }
        .logout-btn { display:flex; align-items:center; gap:1rem; padding:0.875rem 1rem; color:#ef4444; text-decoration:none; border-radius:10px; }
        .logout-btn:hover { background:rgba(239,68,68,0.1); }
        .main-content { flex:1; margin-left:260px; padding:2rem; }
        .dashboard-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:2.5rem; }
        .dashboard-header h1 { font-size:1.75rem; font-weight:800; color:#0f172a; margin-bottom:0.25rem; }
        .dashboard-header p { color:#64748b; }
        .dashboard-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1.5rem; }
        .card { background:white; border-radius:16px; box-shadow:0 4px 6px rgba(0,0,0,0.05); overflow:hidden; }
        .card-header { display:flex; justify-content:space-between; align-items:center; padding:1.5rem; border-bottom:1px solid #e2e8f0; }
        .card-header h2 { font-size:1.125rem; font-weight:700; color:#0f172a; margin:0; }
        .card-body { padding:1.5rem; }
        .mobile-toggle { display:none; background:white; border:2px solid #e2e8f0; padding:0.5rem 0.75rem; border-radius:10px; cursor:pointer; color:#1e293b; font-size:1.2rem; margin-right:0.75rem; }
        .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:99; }
        .sidebar-overlay.active { display:block; }
        .sidebar.active { transform:translateX(0) !important; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
        .form-group { margin-bottom:1rem; }
        .form-group label { display:block; font-weight:600; color:#475569; font-size:0.875rem; margin-bottom:0.4rem; }
        .form-input { width:100%; padding:0.75rem 1rem; border:2px solid #e2e8f0; border-radius:10px; font-size:0.95rem; font-family:inherit; }
        .form-input:focus { outline:none; border-color:#2563eb; }
        .form-input:disabled { background:#f1f5f9; color:#94a3b8; }
        .btn-submit { padding:0.75rem 1.5rem; background:linear-gradient(135deg,#2563eb,#1d4ed8); color:white; border:none; border-radius:10px; font-weight:600; cursor:pointer; font-size:0.95rem; }
        .btn-submit:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(37,99,235,0.35); }
        @media (max-width: 1024px) { .dashboard-grid { grid-template-columns:1fr; } }
        @media (max-width: 768px) {
            .form-row { grid-template-columns:1fr; }
            .mobile-toggle { display:block; }
            .header-left { display:flex; align-items:center; width:100%; }
            .sidebar { transform:translateX(-100%); z-index:100; transition:transform 0.3s ease; }
            .main-content { margin-left:0; padding:1.25rem 1rem; }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js?v=20260924"></script>
    <script src="../assets/js/mobile-nav.js?v=20260924"></script>

    <script>
        let currentEtudiant = null;

        function checkAuth() {
            const etudiant = sessionStorage.getItem('etudiant');
            if (!etudiant) { window.location.href = 'login.html'; return false; }
            currentEtudiant = JSON.parse(etudiant);
            return true;
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }

        function fillForm() {
            document.getElementById('prenom').value = currentEtudiant.prenom || '';
            document.getElementById('nom').value = currentEtudiant.nom || '';
            document.getElementById('email').value = currentEtudiant.email || '';
            document.getElementById('telephone').value = currentEtudiant.telephone || '';
            document.getElementById('whatsapp').value = currentEtudiant.whatsapp || '';
            document.getElementById('ville').value = currentEtudiant.ville || '';
            document.getElementById('profession').value = currentEtudiant.profession || '';
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enregistrement...';
            try {
                const updates = {
                    prenom: document.getElementById('prenom').value.trim(),
                    nom: document.getElementById('nom').value.trim(),
                    telephone: document.getElementById('telephone').value.trim(),
                    whatsapp: document.getElementById('whatsapp').value.trim(),
                    ville: document.getElementById('ville').value.trim(),
                    profession: document.getElementById('profession').value.trim()
                };
                const { data, error } = await window.supabaseClient
                    .from('etudiants')
                    .update(updates)
                    .eq('id', currentEtudiant.id)
                    .select()
                    .single();
                if (error) throw error;
                currentEtudiant = data;
                sessionStorage.setItem('etudiant', JSON.stringify(data));
                document.getElementById('profileMsg').style.color = '#059669';
                document.getElementById('profileMsg').textContent = '✅ Profil mis à jour';
            } catch (err) {
                document.getElementById('profileMsg').style.color = '#ef4444';
                document.getElementById('profileMsg').textContent = 'Erreur: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Enregistrer';
            }
        });

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('newPass').value;
            const p2 = document.getElementById('confirmPass').value;
            const msg = document.getElementById('passMsg');
            if (p1 !== p2) { msg.style.color='#ef4444'; msg.textContent='Les mots de passe ne correspondent pas'; return; }
            try {
                const { error } = await window.supabaseClient.auth.updateUser({ password: p1 });
                if (error) throw error;
                msg.style.color = '#059669';
                msg.textContent = '✅ Mot de passe mis à jour';
                document.getElementById('newPass').value = '';
                document.getElementById('confirmPass').value = '';
            } catch (err) {
                msg.style.color = '#ef4444';
                msg.textContent = 'Erreur: ' + err.message;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (checkAuth()) fillForm();
        });
    </script>
</body>
</html>
