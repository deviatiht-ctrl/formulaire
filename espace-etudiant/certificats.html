<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Certificats - Espace Étudiant | Rasin Ayiti</title>

    <link rel="icon" href="../assets/logorasin.PNG" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css?v=20260924">
</head>
<body>
    <div class="student-dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../assets/logorasin.PNG" alt="Rasin Ayiti" class="sidebar-logo">
                <span>Rasin Ayiti</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Tableau de bord</span></a>
                <a href="mes-formations.html" class="nav-item"><i class="fas fa-graduation-cap"></i><span>Mes Formations</span></a>
                <a href="mes-seminaires.html" class="nav-item"><i class="fas fa-video"></i><span>Mes Séminaires</span></a>
                <a href="mes-evenements.html" class="nav-item"><i class="fas fa-calendar-alt"></i><span>Mes Événements</span></a>
                <a href="certificats.html" class="nav-item active"><i class="fas fa-certificate"></i><span>Certificats</span></a>
                <a href="profil.html" class="nav-item"><i class="fas fa-user"></i><span>Mon Profil</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>Déconnexion</span></a>
            </div>
        </aside>

        <div class="sidebar-overlay" id="studentOverlay" onclick="toggleStudentSidebar()"></div>

        <main class="main-content">
            <header class="dashboard-header">
                <div class="header-left">
                    <button class="mobile-toggle" onclick="toggleStudentSidebar()"><i class="fas fa-bars"></i></button>
                    <div>
                        <h1>Mes Certificats</h1>
                        <p>Tous les certificats que vous avez demandés</p>
                    </div>
                </div>
            </header>

            <div class="card">
                <div class="card-body" id="certificatsList">
                    <p class="no-data">Chargement...</p>
                </div>
            </div>
        </main>
    </div>

    <style>
        .student-dashboard { display:flex; min-height:100vh; background:#f8fafc; }
        .sidebar { width:260px; background:linear-gradient(180deg,#1e293b,#0f172a); padding:1.5rem; display:flex; flex-direction:column; position:fixed; height:100vh; left:0; top:0; }
        .sidebar-header { display:flex; align-items:center; gap:0.75rem; margin-bottom:2.5rem; padding-bottom:1.5rem; border-bottom:1px solid rgba(255,255,255,0.1); }
        .sidebar-logo { width:45px; height:45px; border-radius:10px; }
        .sidebar-header span { color:white; font-weight:700; font-size:1.1rem; }
        .sidebar-nav { flex:1; display:flex; flex-direction:column; gap:0.5rem; }
        .nav-item { display:flex; align-items:center; gap:1rem; padding:0.875rem 1rem; color:#94a3b8; text-decoration:none; border-radius:10px; transition:all 0.3s; }
        .nav-item:hover, .nav-item.active { background:rgba(255,255,255,0.1); color:white; }
        .nav-item i { width:20px; text-align:center; }
        .sidebar-footer { padding-top:1.5rem; border-top:1px solid rgba(255,255,255,0.1); }
        .logout-btn { display:flex; align-items:center; gap:1rem; padding:0.875rem 1rem; color:#ef4444; text-decoration:none; border-radius:10px; }
        .logout-btn:hover { background:rgba(239,68,68,0.1); }
        .main-content { flex:1; margin-left:260px; padding:2rem; }
        .dashboard-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:2.5rem; }
        .dashboard-header h1 { font-size:1.75rem; font-weight:800; color:#0f172a; margin-bottom:0.25rem; }
        .dashboard-header p { color:#64748b; }
        .card { background:white; border-radius:16px; box-shadow:0 4px 6px rgba(0,0,0,0.05); overflow:hidden; }
        .card-header { display:flex; justify-content:space-between; align-items:center; padding:1.5rem; border-bottom:1px solid #e2e8f0; }
        .card-body { padding:1.5rem; }
        .no-data { color:#94a3b8; text-align:center; padding:2rem 0; }
        .mobile-toggle { display:none; background:white; border:2px solid #e2e8f0; padding:0.5rem 0.75rem; border-radius:10px; cursor:pointer; color:#1e293b; font-size:1.2rem; margin-right:0.75rem; }
        .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:99; }
        .sidebar-overlay.active { display:block; }
        .sidebar.active { transform:translateX(0) !important; }
        .cert-item { display:flex; align-items:center; gap:1rem; padding:1.25rem; border:1px solid #e2e8f0; border-radius:12px; margin-bottom:1rem; }
        .cert-icon { width:55px; height:55px; border-radius:12px; background:linear-gradient(135deg,#f59e0b,#d97706); color:white; display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0; }
        .cert-info { flex:1; min-width:0; overflow-wrap:anywhere; }
        .cert-item { flex-wrap:wrap; }
        .cert-item button { white-space:normal; max-width:100%; }
        .cert-info h4 { margin:0 0 0.25rem; color:#0f172a; }
        .cert-info p { margin:0; color:#64748b; font-size:0.85rem; }
        .cert-badge { font-size:0.75rem; padding:4px 10px; border-radius:12px; font-weight:600; white-space:nowrap; }
        .badge-verifie { background:#d1fae5; color:#065f46; }
        .badge-en_attente { background:#fef3c7; color:#92400e; }
        .badge-refuse { background:#fee2e2; color:#991b1b; }
        .badge-delivre { background:#dbeafe; color:#1e40af; }
        @media (max-width: 768px) {
            .mobile-toggle { display:block; }
            .header-left { display:flex; align-items:center; width:100%; }
            .sidebar { transform:translateX(-100%); z-index:100; transition:transform 0.3s ease; }
            .main-content { margin-left:0; padding:1.25rem 1rem; }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js?v=20260924"></script>
    <script src="../assets/js/mobile-nav.js?v=20260924"></script>
    <script src="../assets/js/admin-workflows.js?v=20260924"></script>

    <script>
        function toggleStudentSidebar() {
            const open = document.querySelector('.sidebar').classList.toggle('active');
            document.getElementById('studentOverlay').classList.toggle('active', open);
            document.querySelector('.mobile-toggle').setAttribute('aria-expanded', String(open));
        }

        async function logout() {
            await window.supabaseClient.auth.signOut();
            sessionStorage.removeItem('etudiant');
            window.location.href = 'login.html';
        }

        async function loadCertificats() {
            const container = document.getElementById('certificatsList');
            container.textContent = 'Chargement...';
            try {
                const { data, error } = await window.supabaseClient.auth.getUser();
                if (error || !data.user) { window.location.href = 'login.html'; return; }
                const [requests, certificates] = await Promise.all([
                    AdminWorkflows.all(() => window.supabaseClient.rpc('rasinayiti_my_certificate_requests').order('effective_type').order('canonical_id')),
                    AdminWorkflows.all(() => window.supabaseClient.rpc('rasinayiti_my_certificates').order('id'))
                ]);
                container.replaceChildren();
                const info = document.createElement('p');
                info.textContent = 'Les PDF sont disponibles après vérification du paiement et publication par l’administration, une fois l’activité terminée.';
                container.append(info);
                if (!requests.length) {
                    const empty = document.createElement('p'); empty.className = 'no-data'; empty.textContent = 'Vous n’avez demandé aucun certificat pour le moment.'; container.append(empty);
                }
                for (const request of requests) {
                    const certificate = certificates.find(c => c.id === request.certificate_id);
                    const item = document.createElement('div'); item.className = 'cert-item';
                    const details = document.createElement('div'); details.className = 'cert-info';
                    const title = document.createElement('h4'); title.textContent = request.titre;
                    const status = document.createElement('p');
                    status.textContent = certificate ? 'Certificat publié — ' + certificate.nom_complet
                        : request.paiement === 'verifie' ? (request.eligible ? 'Paiement vérifié — PDF en préparation' : 'Paiement vérifié — en attente de la fin de l’activité ou de validation de l’inscription')
                        : request.paiement === 'refuse' ? 'Paiement refusé — contactez l’administration' : 'Paiement en attente de vérification';
                    details.append(title, status); item.append(details);
                    if (certificate) {
                        const button = document.createElement('button'); button.type = 'button'; button.className = 'btn-primary'; button.textContent = 'Télécharger PDF';
                        button.onclick = async () => {
                            button.disabled = true;
                            try { await AdminWorkflows.download(certificate.storage_path, 'certificat-' + certificate.id + '.pdf'); }
                            catch (downloadError) { status.textContent = 'Téléchargement impossible : ' + AdminWorkflows.error(downloadError); }
                            finally { button.disabled = false; }
                        };
                        item.append(button);
                    }
                    container.append(item);
                }
                const refresh = document.createElement('button'); refresh.type = 'button'; refresh.className = 'btn-primary'; refresh.textContent = 'Actualiser'; refresh.onclick = loadCertificats; container.append(refresh);
            } catch (error) {
                container.textContent = 'Impossible de charger les certificats : ' + AdminWorkflows.error(error);
                const retry = document.createElement('button'); retry.type = 'button'; retry.textContent = 'Réessayer'; retry.onclick = loadCertificats; container.append(retry);
            }
        }

        document.addEventListener('DOMContentLoaded', loadCertificats);
    </script>
</body>
</html>
